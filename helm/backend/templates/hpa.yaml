apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
    name: yasn-backend-hpa
spec:
    scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: yasn-backend
    minReplicas: {{ .Values.hpa.minReplicas }}
    maxReplicas: {{ .Values.hpa.maxReplicas }}
    metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.cpuTarget }}