apiVersion: apps/v1
kind: Deployment
metadata:
  name: yasn-backend
  labels:
    app: yasn-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yasn-backend
  template:
    metadata:
      labels:
        app: yasn-backend
    spec:
      containers:
        - name: yasn-backend
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: "{{ $value }}"
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
